name: Validate ranked analysis delivery
on:
  push:
    paths:
      - '.github/workflows/validate-evolution.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Provision disposable PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --createdb "$(id -un)"
          createdb brawl_test
      - name: Run backend tests
        env:
          BRAWL_TEST_DATABASE_URL: postgresql:///brawl_test
        run: python -m unittest discover -s tests -v
      - name: Restore and compare the test database
        run: |
          pg_dump --format=custom --no-owner --no-privileges --dbname=brawl_test --file="$RUNNER_TEMP/brawl.dump"
          createdb brawl_restore
          pg_restore --exit-on-error --no-owner --no-privileges --dbname=brawl_restore "$RUNNER_TEMP/brawl.dump"
          DATABASE_URL=postgresql:///brawl_restore python -c 'from app.db import prepare_collection; prepare_collection()'
          sql="SELECT id, played_at, map_name, mode, winner, observed_elo, bans, bans_conflict FROM brawl_lab.meta_sample_battles ORDER BY id"
          diff -u <(psql -v ON_ERROR_STOP=1 -At -d brawl_test -c "$sql") <(psql -v ON_ERROR_STOP=1 -At -d brawl_restore -c "$sql")
