services:
  - type: cron
    name: brawl-ranked-collect
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements-collector.txt
    startCommand: python -m app.jobs.collect
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: BRAWL_API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
